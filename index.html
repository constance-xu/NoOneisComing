<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constance — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0a;
    --bg-elev:#141412;
    --ink:#f4f3ee;
    --ink-dim:#948f83;
    --green:#a7c088;
    --green-soft:rgba(167,192,136,.14);
    --line:rgba(244,243,238,.12);
    --line-strong:rgba(244,243,238,.28);
    --gap:3px;
  }

  *{margin:0;padding:0;box-sizing:border-box;border-radius:0 !important;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none;}
  img{display:block;width:100%;height:100%;object-fit:cover;}

  a:focus-visible, button:focus-visible{
    outline:1px solid var(--green);
    outline-offset:3px;
  }

  /* ===== NAV ===== */
  .nav{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:28px 48px;
    mix-blend-mode:difference;
  }
  .nav-mark{
    font-family:'Fraunces',serif;font-weight:400;font-size:20px;letter-spacing:.02em;
  }
  .nav-links{display:flex;gap:36px;list-style:none;}
  .nav-links a{
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
    position:relative;padding-bottom:4px;
  }
  .nav-links a::after{
    content:'';position:absolute;left:0;bottom:0;width:100%;height:1px;
    background:var(--green);transform:scaleX(0);transform-origin:left;
    transition:transform .35s ease;
  }
  .nav-links a:hover::after{transform:scaleX(1);}

  /* ===== HERO ===== */
  .hero{
    position:relative;
    height:100vh;min-height:640px;
    display:flex;align-items:flex-end;
    overflow:hidden;
    cursor:crosshair;
    border-bottom:1px solid var(--line);
  }
  .hero-inner{
    width:100%;
    padding:0 48px 88px;
    display:flex;justify-content:flex-end;
  }
  .hero-text{
    text-align:right;
    max-width:720px;
  }
  .hero-eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:22px;
    display:flex;align-items:center;justify-content:flex-end;gap:10px;
  }
  .hero-eyebrow .dot{width:6px;height:6px;background:var(--green);display:inline-block;}
  .hero-name{
    font-family:'Fraunces',serif;
    font-weight:340;
    font-size:clamp(64px,11.5vw,196px);
    line-height:.92;
    letter-spacing:-.01em;
    color:var(--ink);
  }
  .hero-desc{
    margin-top:26px;
    margin-left:auto;
    max-width:380px;
    font-size:13.5px;
    line-height:1.85;
    letter-spacing:.01em;
    color:var(--green);
    font-family:'Inter',sans-serif;
  }
  .scroll-cue{
    position:absolute;left:48px;bottom:40px;
    display:flex;align-items:center;gap:12px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);
    z-index:3;
  }
  .scroll-cue .line{width:32px;height:1px;background:var(--line-strong);position:relative;overflow:hidden;}
  .scroll-cue .line::after{
    content:'';position:absolute;left:-100%;top:0;width:100%;height:100%;background:var(--green);
    animation:scrollline 1.8s ease-in-out infinite;
  }
  @keyframes scrollline{
    0%{left:-100%;} 50%{left:0;} 100%{left:100%;}
  }

  /* cursor-follow images */
  .trail-img{
    position:absolute;
    width:158px;height:210px;
    top:0;left:0;
    pointer-events:none;
    filter:grayscale(1) contrast(1.05) brightness(.98);
    box-shadow:0 24px 48px rgba(0,0,0,.55);
    opacity:0;
    transform:translate(-50%,-50%);
    transition:opacity .12s linear;
    z-index:2;
    will-change:opacity;
    overflow:hidden;
  }
  .trail-img.in{
    opacity:1;
  }

  /* ===== WORK SECTION ===== */
  .work{padding:120px 48px 40px;}
  .section-head{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:56px;
    border-bottom:1px solid var(--line);
    padding-bottom:24px;
    flex-wrap:wrap;gap:16px;
  }
  .section-label{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-dim);
    display:flex;align-items:center;gap:10px;
  }
  .section-label .dot{width:6px;height:6px;background:var(--green);}
  .section-title{
    font-family:'Fraunces',serif;font-style:italic;font-weight:400;
    font-size:26px;color:var(--ink);
  }
  .section-count{
    font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-dim);
  }

  .grid{
    column-count:3;
    column-gap:var(--gap);
  }
  .card{
    position:relative;
    margin-bottom:var(--gap);
    break-inside:avoid;
    overflow:hidden;
    background:var(--bg-elev);
    border:1px solid var(--line);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:22px 22px 18px;
    transition:background .4s ease, border-color .4s ease;
  }
  .card:hover{
    background:#1a1a17;
    border-color:var(--line-strong);
  }
  .card-index{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--ink-dim);
    letter-spacing:.06em;
  }
  .card-title{
    font-family:'Fraunces',serif;
    font-weight:400;
    font-size:26px;
    letter-spacing:-.01em;
    color:var(--ink);
    margin-top:34px;
    transition:color .4s ease;
  }
  .card:hover .card-title{color:var(--green);}
  .card-meta{
    margin-top:16px;
    display:flex;justify-content:space-between;align-items:flex-end;
  }
  .card-cat{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--green);
  }
  .card-year{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--ink-dim);
  }

  @media (max-width:1024px){ .grid{column-count:2;} }
  @media (max-width:640px){
    .grid{column-count:1;}
    .nav{padding:20px 22px;}
    .nav-links{gap:20px;}
    .hero-inner{padding:0 22px 56px;}
    .hero-text{max-width:100%;}
    .hero-desc{margin-left:0;text-align:left;}
    .work{padding:88px 16px 20px;}
  }

  /* ===== FOOTER ===== */
  .footer{
    margin-top:60px;
    padding:110px 48px 60px;
    border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:flex-end;
    flex-wrap:wrap;gap:40px;
  }
  .footer-cta{
    font-family:'Fraunces',serif;font-weight:340;
    font-size:clamp(34px,5vw,64px);
    line-height:1.05;letter-spacing:-.01em;
    max-width:560px;
  }
  .footer-cta em{color:var(--green);font-style:italic;}
  .footer-meta{
    display:flex;flex-direction:column;gap:10px;
    font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-dim);
    text-align:right;
  }
  .footer-meta a:hover{color:var(--green);}
  @media (max-width:640px){
    .footer{padding:70px 22px 40px;flex-direction:column;align-items:flex-start;}
    .footer-meta{text-align:left;}
  }
</style>
</head>
<body>

  <nav class="nav">
    <div class="nav-mark">C.</div>
    <ul class="nav-links">
      <li><a href="#work">Work</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <section class="hero" id="hero">
    <div class="hero-inner">
      <div class="hero-text">
        <div class="hero-eyebrow"><span>Designer · Based in Shanghai</span><span class="dot"></span></div>
        <h1 class="hero-name">Constance</h1>
        <p class="hero-desc">专注品牌视觉与展览体验设计，擅长在克制的形式语言中寻找恰到好处的重量感。相信好的设计是被感知，而非被察觉的。</p>
      </div>
    </div>
    <div class="scroll-cue"><span>Scroll</span><span class="line"></span></div>
  </section>

  <section class="work" id="work">
    <div class="section-head">
      <div class="section-label"><span class="dot"></span>Selected Work</div>
      <div class="section-title">近期项目</div>
      <div class="section-count">2026</div>
    </div>

    <div class="grid" id="grid">
      <!-- cards injected by JS -->
    </div>
  </section>

  <footer class="footer" id="contact">
    <div class="footer-cta">有一个想法？<br>让我们 <em>聊聊</em>。</div>
    <div class="footer-meta">
      <a href="mailto:hello@constance.design">hello@constance.design</a>
      <a href="#">Instagram</a>
      <a href="#">Behance</a>
      <span>© 2026 Constance</span>
    </div>
  </footer>

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isFinePointer = window.matchMedia('(pointer: fine)').matches;

  if (!prefersReducedMotion && isFinePointer) {
    let lastX = null, lastY = null, idx = 0;
    let current = null;
    const THRESHOLD = 90; // 移动超过该距离才切换下一张

    hero.addEventListener('mousemove', (e) => {
      const rect = hero.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (lastX === null) { lastX = x; lastY = y; return; }
      const dist = Math.hypot(x - lastX, y - lastY);
      if (dist < THRESHOLD) return;
      lastX = x; lastY = y;

      // 立即移除上一张，同一时刻只显示一张，没有交叉淡出的延迟
      if (current) current.remove();

      const el = document.createElement('img');
      el.className = 'trail-img';
      el.src = trailImages[idx % trailImages.length];
      idx++;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      hero.appendChild(el);
      current = el;

      requestAnimationFrame(() => el.classList.add('in'));
    });

    hero.addEventListener('mouseleave', () => {
      lastX = null; lastY = null;
      if (current) { current.remove(); current = null; }
    });
  }
</script>
